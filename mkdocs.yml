site_name: Group 2 Project -- Intelligent Building Management System through Data-Driven Thermodynamics Modeling and Control

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true            
            show_root_toc_entry: false

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md 
  - Engineering Document: literature_review/PROJECT_DOCUMENT.md
  - Database Extraction: db_extraction.md 
  - Database Augmentation: db_augmentation.md 
  - Thermodynamics Modeling: 
      - pySINDy examples: thermodynamics_modeling/thermodynamics_modeling_with_sindy.md
      - Smart Building Dynamic Modeling: thermodynamics_modeling/smart_building_modeling.md 
      - Dynamic mode decomposition: thermodynamics_modeling/DMD.md
      - PINNs: thermodynamics_modeling/PINNs.md
      - NeuroMANCER: thermodynamics_modeling/NeuroMANCER.md
      - PyTorch Neural ODE: thermodynamics_modeling/pytorch_NODE.md
  - MPC: do_mpc_setup.md
  - Slurm pipeline: slurm_pipeline.md 
  - List of alternatives: List_of_possible_alternative_methods_for_data.md
