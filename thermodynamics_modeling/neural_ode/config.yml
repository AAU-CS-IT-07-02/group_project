# === Data location ===
data_root: "../data_fragmentation/out"
room_folder: "rooma_4_1_2023_8_05_4_30_2023_20_20"   # pick any room_* folder you want

# Filenames inside that room folder
files:
  sensors: "data_sensors.csv"
  actuators: "data_actuators.csv"
  configuration: "data_configuration.csv"

# --- Column mapping (EDIT THESE to match your headers) ---
channels:
  y: ["room_temp"]                # measured zone temp (°C) -> model will predict this
  u: ["q_hvac_kw"]                # actuator(s) driving heat/cool; can be a proxy (see notes)
  w: ["t_outdoor", "ghi"]         # exogenous: outdoor temperature, solar, etc.

# --- Data & batching ---
timestamp_column: "timestamp"     # change if your time column has a different name
sampling_seconds: 300             # 5-minute grid
horizon_steps: 288                # 24h windows @ 5 min
stride_steps: 60                  # slide window by 5h
train_valid_test_split: [0.6, 0.2, 0.2]

# --- Model state & priors (simple 2-state RC + NN residual) ---
state:
  names: ["T_air", "T_mass"]

rc_init:
  C_air: 5000.0
  C_mass: 20000.0
  UA_out: 0.5
  UA_am: 0.8

residual:
  hidden: 32

# --- Solver ---
solver:
  method: "tsit5"                 # good default for non-stiff ODEs
  sensitivity: "adjoint"          # or "autograd" for shorter horizons
  atol: 1.0e-3
  rtol: 1.0e-3

# --- Training ---
train:
  epochs: 50
  batch_size: 8
  lr: 3.0e-3
  seed: 42
  device: "auto"                  # "cuda", "cpu", or "auto"
  save_path: "building_node.pt"
